name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Capacitor
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lab-voz-destreza.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lab-voz-destreza-apk
          path: lab-voz-destreza.apk

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" lab-voz-destreza.apk \
            --title "APK build #${GITHUB_RUN_NUMBER}" \
            --notes "APK debug (instalable). Commit ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
